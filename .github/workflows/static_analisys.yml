name: Static analysis
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BUILD_DIR: /tmp/build

    steps:
    - name: Check out source code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Build docker image
      run: docker build --tag=swayimg --file=.github/workflows/Dockerfile.Arch .

    - name: Run docker container
      run: >
        docker run --tty --detach
        --name=swayimg
        --volume=$PWD:$PWD:ro
        --workdir=$PWD
        swayimg

    - name: Setup
      run: >
        docker exec swayimg
        meson setup --auto-features=enabled -D tests=enabled ${{ env.BUILD_DIR }}

    - name: Compile
      run: >
        docker exec swayimg
        meson compile -C ${{ env.BUILD_DIR }}

    - name: Run analisys
      # clang-tidy per file, run in parallel in the background; each output goes
      # into its own /tmp/<file>.log so we can cat them all in order afterwards.
      run: |
        docker exec swayimg bash -c '
          pids=()
          status=0
          for f in src/*.cpp; do
            clang-tidy -p ${{ env.BUILD_DIR }} -quiet "$f" > /tmp/$(basename "$f").log 2>&1 &
            pids+=("$!")
            # Bound the number of concurrent jobs to the CPU count
            if [ "${#pids[@]}" -ge "$(nproc)" ]; then
              wait "${pids[0]}" || status=1
              pids=("${pids[@]:1}")
            fi
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          cat /tmp/*pp.log
          exit $status
        '
